# Production on the VPS (ADR 0029): the API, the inference service, Postgres
# and the S3 server. Run by deploy/publish.sh as the project nupii-self, with
# the values of /opt/nupii-self/.env (not versioned; see deploy/.env.prod.example).
# The ports are only on 127.0.0.1: the Caddy of the host is the way in.
name: nupii-self

services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?sslmode=disable
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
      # The key of the service account: push (RN-36) and the delete of a user (RN-03).
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      INFERENCE_URL: http://inference:8000
      S3_ENDPOINT: http://s3:8333
      # The clients reach the photos at this address (temporary URLs).
      S3_PUBLIC_ENDPOINT: https://media.nupii.com.br
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      # ADR 0029, item 8: the web with an account calls the routes with a token.
      WEB_ORIGINS: https://app.nupii.com.br
      # ADR 0029, item 6: Caddy reaches the API through the gateway of this network.
      TRUSTED_PROXIES: 172.31.90.1/32
    volumes:
      - /opt/nupii-self/secrets/firebase.json:/run/secrets/firebase.json:ro
    ports:
      - "127.0.0.1:8090:8080"
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 4s
      retries: 30

  inference:
    build: ../inference
    restart: unless-stopped
    volumes:
      # deploy/publish.sh copies the weight files here.
      - /opt/nupii-self/models:/app/models:ro
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 30

  db:
    build: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:8091:8333"
    volumes:
      - s3-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 2s
      retries: 30

networks:
  default:
    ipam:
      config:
        # A fixed range: the gateway 172.31.90.1 is the trusted proxy of the API.
        - subnet: 172.31.90.0/24

volumes:
  db-data:
  s3-data:
