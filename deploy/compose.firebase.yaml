# Override of compose.yaml: the API uses the real Firebase project in place of
# the Authentication emulator. ./dev.sh firebase loads backend/.env, which has
# FIREBASE_PROJECT_ID and GOOGLE_APPLICATION_CREDENTIALS (the path of the key
# file on this machine, outside the repository).
services:
  api:
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?}
      # An empty value is the same as no emulator.
      FIREBASE_AUTH_EMULATOR_HOST: ""
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS:?}:/run/secrets/firebase-service-account.json:ro
