# Local environment and CI: the API, the state that it needs and the inference service.
# The values come from deploy/.env (not versioned). See deploy/.env.example.
name: nupii-local

services:
  api:
    build: ../backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # The local environment uses the Authentication emulator. With this
      # variable the API does not check the signature of the ID tokens.
      FIREBASE_PROJECT_ID: demo-nupii
      FIREBASE_AUTH_EMULATOR_HOST: auth:9099
      INFERENCE_URL: http://inference:8000
      # The API reaches the object store inside the compose network. The
      # clients of the API reach it at the public address, which is in the
      # temporary URLs of the photos.
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      s3:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      # The image has no shell. The binary has a command for this check.
      test: ["CMD", "/api", "healthcheck"]
      interval: 2s
      timeout: 4s
      retries: 30

  auth:
    build: ./firebase-emulator
    ports:
      - "127.0.0.1:9099:9099"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 4s
      retries: 30

  inference:
    build: ../inference
    volumes:
      # The weight files are not in the image. The script
      # inference/download_weights.sh puts them in this directory.
      - ../inference/models:/app/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      # The service answers only after it loads the weight files.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 2s
      timeout: 4s
      retries: 30

  db:
    build: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # The check uses TCP. During the first start, Postgres runs a temporary
      # server that listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.53
    environment:
      # SeaweedFS creates this access key and this bucket when it starts.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  db-data:
  s3-data:
