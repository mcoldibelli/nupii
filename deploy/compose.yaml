# Local environment and CI: the state that the API needs.
# The values come from deploy/.env (not versioned). See deploy/.env.example.
name: nupii-local

services:
  db:
    build: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # The check uses TCP. During the first start, Postgres runs a temporary
      # server that listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.53
    environment:
      # SeaweedFS creates this access key and this bucket when it starts.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in deploy/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in deploy/.env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in deploy/.env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  db-data:
  s3-data:
