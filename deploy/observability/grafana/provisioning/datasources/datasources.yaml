# The data sources of Grafana (ADR 0032). A log line opens its trace by the
# trace_id of the JSON of the API, and a trace opens its log lines.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          url: "$${__value.raw}"
          datasourceUid: tempo
  # The counts of the database (#303): only the views of the schema metrics.
  - name: Nupii DB
    uid: nupii-db
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: metrics_reader
    jsonData:
      database: $NUPII_DB
      sslmode: disable
      postgresVersion: 1800
      maxOpenConns: 2
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
