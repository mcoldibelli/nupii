# Loki 3.7, one process, files on the volume (ADR 0032). Based on
# cmd/loki/loki-local-config.yaml of the v3.7.10 tag.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ADR 0032, item 6: 7 days of logs. The compactor deletes the older chunks.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/retention
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
