[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_photos: equality test with the real nose photos, which are not in the repository (ADR 0019)",
]
addopts = "-m 'not real_photos'"

[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
