openapi: 3.1.0
info:
  title: Nupii API
  version: 0.1.0
  description: |
    Contrato da API do Nupii. Este arquivo é a fonte do contrato.
    Os tipos do servidor e dos clientes são gerados dele.
tags:
  - name: service
    description: Estado do serviço.
  - name: identity
    description: Conta do tutor.
  - name: pets
    description: Pets do tutor.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Informa se o serviço está pronto para atender requisições.
      responses:
        "200":
          description: O serviço está em execução e o banco de dados responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: O banco de dados não responde. O código do erro é `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Devolve o tutor da conta que fez a chamada.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O tutor da conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: A conta ainda não registrou o tutor. O código do erro é `owner_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: registerMe
      tags: [identity]
      summary: Registra o tutor da conta, com o aceite dos termos de uso.
      description: |
        O e-mail vem do token. Uma segunda chamada da mesma conta não muda o tutor e devolve 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOwnerRequest"
      responses:
        "200":
          description: A conta já tinha um tutor. A resposta tem esse tutor, sem mudança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "201":
          description: O tutor foi registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          description: O corpo é inválido, o nome está vazio ou a versão dos termos não é a vigente. O código do erro é `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: Lista os pets do tutor, em ordem de nome.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os pets do tutor que não foram excluídos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      tags: [pets]
      summary: Cria um pet do tutor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: O pet foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      tags: [pets]
      summary: Devolve um pet do tutor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePet
      tags: [pets]
      summary: Troca todos os dados de um pet do tutor.
      description: Um dado opcional que não vem no corpo fica vazio no pet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "200":
          description: O pet com os dados novos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Exclui um pet do tutor.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: O pet foi excluído.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/photo:
    parameters:
      - $ref: "#/components/parameters/PetId"
    put:
      operationId: setPetPhoto
      tags: [pets]
      summary: Envia a foto de perfil de um pet do tutor.
      description: A foto nova substitui a anterior.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem JPEG, PNG ou WebP, com no máximo 5 MB.
      responses:
        "200":
          description: O pet, com a URL temporária da foto nova.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/noseprints:
    parameters:
      - $ref: "#/components/parameters/PetId"
    post:
      operationId: registerNoseprint
      tags: [biometrics]
      summary: Cadastra o focinho de um pet do tutor com uma foto.
      description: |
        Só um cachorro tem cadastro biométrico. O cadastro novo passa a ser o principal do pet.
        Uma foto recusada não é gravada.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Foto do focinho. Imagem JPEG, PNG ou WebP, com no máximo 8 MB.
      responses:
        "201":
          description: O cadastro biométrico criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Noseprint"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        "422":
          $ref: "#/components/responses/NosePhotoRefused"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/noseprint:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getNoseprint
      tags: [biometrics]
      summary: Devolve o cadastro biométrico principal de um pet do tutor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O cadastro biométrico principal do pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Noseprint"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: |
            O pet não tem cadastro biométrico, com o código `noseprint_not_found`.
            Ou o pet não existe para este tutor, com o código `pet_not_found`.
            Ou a conta ainda não registrou o tutor, com o código `owner_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/identifications:
    post:
      operationId: identifyNose
      tags: [biometrics]
      summary: Busca os pets parecidos com a foto de um focinho.
      description: |
        Operação pública: quem encontrou um cão não precisa de conta.
        A resposta tem no máximo 3 candidatos e nenhum dado do tutor. A foto não é gravada.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Foto do focinho. Imagem JPEG, PNG ou WebP, com no máximo 8 MB.
                latitude:
                  type: number
                  format: double
                  description: Latitude de quem encontrou o cão. Vem junto com a longitude.
                longitude:
                  type: number
                  format: double
                  description: Longitude de quem encontrou o cão. Vem junto com a latitude.
      responses:
        "200":
          description: A identificação, com os candidatos do mais parecido para o menos parecido. A lista pode ser vazia.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identification"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "422":
          $ref: "#/components/responses/NosePhotoRefused"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
        default:
          $ref: "#/components/responses/Error"
  /v1/identifications/{identificationId}/confirmation:
    parameters:
      - name: identificationId
        in: path
        required: true
        description: Identificador da identificação.
        schema:
          type: string
          format: uuid
    post:
      operationId: confirmIdentification
      tags: [biometrics]
      summary: Confirma um candidato e deixa o contato para o tutor do pet.
      description: |
        Operação pública. O contato vai só para o tutor do pet confirmado.
        A foto da consulta é gravada na primeira confirmação que envia a foto.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [candidateId, name, phone]
              properties:
                candidateId:
                  type: string
                  format: uuid
                  description: Um candidato desta identificação.
                name:
                  type: string
                  description: Nome de quem encontrou o cão, com no máximo 120 caracteres.
                phone:
                  type: string
                  description: Telefone de quem encontrou o cão, de 8 a 30 caracteres.
                message:
                  type: string
                  description: Mensagem para o tutor, com no máximo 500 caracteres.
                file:
                  type: string
                  format: binary
                  description: A foto usada na identificação. Imagem JPEG, PNG ou WebP, com no máximo 8 MB.
      responses:
        "204":
          description: A confirmação foi gravada.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          description: A identificação ou o candidato não existe. O código do erro é `identification_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/found-notices:
    get:
      operationId: listFoundNotices
      tags: [biometrics]
      summary: Lista os avisos de quem encontrou um pet do tutor.
      description: Os avisos vêm do mais novo para o mais antigo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os avisos de encontro dos pets do tutor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundNoticeList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: O mural, as ocorrências abertas dos tipos perdido e achado.
      description: Operação pública. 20 ocorrências por página, da mais nova para a mais antiga.
      parameters:
        - name: page
          in: query
          required: false
          description: Número da página, a partir de 1.
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 1
      responses:
        "200":
          description: Uma página do mural, com as contagens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/lost:
    post:
      operationId: reportLost
      tags: [reports]
      summary: Registra o desaparecimento de um pet do tutor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LostReportInput"
      responses:
        "201":
          description: O desaparecimento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        "409":
          description: O pet já tem um desaparecimento aberto. O código do erro é `lost_report_open`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/found:
    post:
      operationId: reportFound
      tags: [reports]
      summary: Publica um achado, com a foto do focinho.
      description: |
        Operação pública. A resposta tem o código que resolve o achado. O código aparece só nesta resposta.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, latitude, longitude]
              properties:
                file:
                  type: string
                  format: binary
                  description: A foto do focinho usada na identificação. JPEG, PNG ou WebP, com no máximo 8 MB.
                latitude:
                  type: number
                  format: double
                longitude:
                  type: number
                  format: double
                place:
                  type: string
                  description: Nome do local, com no máximo 200 caracteres.
                description:
                  type: string
                  description: Recado, com no máximo 1.000 caracteres.
      responses:
        "201":
          description: O achado publicado, com o código que resolve o achado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundReportCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/{reportId}:
    parameters:
      - name: reportId
        in: path
        required: true
        description: Identificador da ocorrência.
        schema:
          type: string
          format: uuid
    get:
      operationId: getReport
      tags: [reports]
      summary: A ficha de uma ocorrência.
      description: Operação pública. A ficha de um desaparecimento tem os avistamentos.
      responses:
        "200":
          description: A ocorrência.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/{reportId}/sightings:
    parameters:
      - name: reportId
        in: path
        required: true
        description: Identificador da ocorrência.
        schema:
          type: string
          format: uuid
    post:
      operationId: reportSighting
      tags: [reports]
      summary: Registra um avistamento em um desaparecimento aberto.
      description: Operação pública. Sem latitude e longitude, vale o ponto do desaparecimento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SightingInput"
      responses:
        "201":
          description: O avistamento registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sighting"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "409":
          description: A ocorrência não é um desaparecimento aberto. O código do erro é `report_not_open`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/{reportId}/resolution:
    parameters:
      - name: reportId
        in: path
        required: true
        description: Identificador da ocorrência.
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveReport
      tags: [reports]
      summary: O autor resolve uma ocorrência dele.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A ocorrência resolvida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/reports/{reportId}/code-resolution:
    parameters:
      - name: reportId
        in: path
        required: true
        description: Identificador da ocorrência.
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveFoundReport
      tags: [reports]
      summary: Resolve um achado com o código da criação.
      description: Operação pública. Um código errado recebe a mesma resposta de um achado que não existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        "200":
          description: O achado resolvido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/ReportNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/reports:
    get:
      operationId: listMyReports
      tags: [reports]
      summary: Os desaparecimentos registrados pelo tutor, abertos e resolvidos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: As ocorrências do tutor, da mais nova para a mais antiga.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/location:
    put:
      operationId: setMyLocation
      tags: [alerts]
      summary: Guarda a última localização do tutor.
      description: O sistema guarda só a última localização. Ela decide quem recebe o alerta de proximidade.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Location"
      responses:
        "204":
          description: A localização foi guardada.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices:
    put:
      operationId: registerDevice
      tags: [alerts]
      summary: Registra o dispositivo do tutor para receber push.
      description: Um token de outro tutor passa para o tutor que chama (RN-31).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Device"
      responses:
        "204":
          description: O dispositivo está registrado.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices/removal:
    post:
      operationId: removeDevice
      tags: [alerts]
      summary: Remove um dispositivo do tutor.
      description: |
        Um token de outro tutor fica como está, com a mesma resposta (RN-31).
        O token vai no corpo, e não no caminho, para não entrar no log das requisições.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: O dispositivo não recebe mais push deste tutor.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/notifications:
    get:
      operationId: listNotifications
      tags: [alerts]
      summary: As 50 notificações mais recentes do tutor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: As notificações, da mais nova para a mais antiga.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        description: Identificador da notificação.
        schema:
          type: string
          format: uuid
    post:
      operationId: markNotificationRead
      tags: [alerts]
      summary: Marca uma notificação do tutor como lida.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: A notificação está lida.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: A notificação não existe para este tutor. O código do erro é `notification_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/health-events:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: listHealthEvents
      tags: [health]
      summary: Os eventos de saúde de um pet do tutor, do mais novo para o mais antigo.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os eventos de saúde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEventList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createHealthEvent
      tags: [health]
      summary: Cria um evento de saúde de um pet do tutor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthEventInput"
      responses:
        "201":
          description: O evento criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEvent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/health-events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: eventId
        in: path
        required: true
        description: Identificador do evento de saúde.
        schema:
          type: string
          format: uuid
    put:
      operationId: updateHealthEvent
      tags: [health]
      summary: Troca todos os dados de um evento de saúde.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HealthEventInput"
      responses:
        "200":
          description: O evento alterado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEvent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/HealthEventNotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteHealthEvent
      tags: [health]
      summary: Apaga um evento de saúde e os anexos dele.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: O evento foi apagado.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/HealthEventNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/health-events/{eventId}/attachments:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: eventId
        in: path
        required: true
        description: Identificador do evento de saúde.
        schema:
          type: string
          format: uuid
    get:
      operationId: listHealthAttachments
      tags: [health]
      summary: Os anexos de um evento de saúde.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os anexos, do mais antigo para o mais novo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAttachmentList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/HealthEventNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createHealthAttachment
      tags: [health]
      summary: Envia um anexo de um evento de saúde.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Imagem JPEG, PNG ou WebP, ou PDF, com no máximo 10 MB.
                fileName:
                  type: string
                  description: Nome do arquivo. Sem este campo, vale o nome da parte "file".
      responses:
        "201":
          description: O anexo criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthAttachment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/HealthEventNotFound"
        "409":
          description: O evento já tem 10 anexos. O código do erro é `attachment_limit`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/health-events/{eventId}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: eventId
        in: path
        required: true
        description: Identificador do evento de saúde.
        schema:
          type: string
          format: uuid
      - name: attachmentId
        in: path
        required: true
        description: Identificador do anexo.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteHealthAttachment
      tags: [health]
      summary: Apaga um anexo de um evento de saúde.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: O anexo foi apagado.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/HealthEventNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/upcoming-care:
    get:
      operationId: listUpcomingCare
      tags: [health]
      summary: Os próximos cuidados de vacina e de medicação dos pets do tutor.
      description: Da data mais próxima para a mais distante. Uma data passada é um cuidado atrasado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os próximos cuidados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpcomingCareList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/share-links:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: listShareLinks
      tags: [health]
      summary: Os links ativos da carteirinha de um pet, com as aberturas.
      description: Um link revogado ou vencido não vem na lista (RN-40).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os links ativos, do mais novo para o mais antigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLinkList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ShareLinkNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createShareLink
      tags: [health]
      summary: Cria um link da carteirinha do pet, válido por 30 dias (RN-40).
      description: O token só vem nesta resposta. O banco guarda só o SHA-256 dele (RN-39).
      security:
        - bearerAuth: []
      responses:
        "201":
          description: O link criado, com o token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedShareLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ShareLinkNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}/share-links/{shareLinkId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
      - name: shareLinkId
        in: path
        required: true
        description: Identificador do link da carteirinha.
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeShareLink
      tags: [health]
      summary: Revoga um link da carteirinha. O link para de abrir na hora (RN-41).
      description: Revogar um link já revogado ou vencido recebe a mesma resposta.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: O link está revogado.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ShareLinkNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/share-links/opening:
    post:
      operationId: openShareLink
      tags: [health]
      summary: Abre a carteirinha pelo token do link e conta a abertura.
      description: |
        Operação pública (RF-31). O token vai no corpo, e não no caminho, para não entrar no log
        das requisições. Um token desconhecido, revogado, vencido ou de um pet excluído recebe
        a mesma resposta 404 (RN-41).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "200":
          description: A carteirinha.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCard"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/ShareLinkNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token do Firebase Authentication, no cabeçalho `Authorization`.
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: Identificador do pet.
      schema:
        type: string
        format: uuid
  schemas:
    PetInput:
      type: object
      description: Dados de um pet que o tutor informa.
      required: [name, species]
      properties:
        name:
          type: string
          description: Nome do pet. Não pode ser vazio.
          maxLength: 100
        species:
          $ref: "#/components/schemas/Species"
        breed:
          type: string
          description: Raça, em texto livre.
          maxLength: 100
        sex:
          $ref: "#/components/schemas/Sex"
        size:
          $ref: "#/components/schemas/Size"
        birthDate:
          type: string
          format: date
          description: Data de nascimento. Não pode ser uma data futura.
        weightKg:
          type: number
          format: double
          description: Peso em quilos, com no máximo 2 casas decimais.
          minimum: 0.01
          maximum: 999.99
        neutered:
          type: boolean
          description: Informa se o pet é castrado.
        vetName:
          type: string
          description: Nome do veterinário.
          maxLength: 120
        vetClinic:
          type: string
          description: Clínica do veterinário.
          maxLength: 120
        vetPhone:
          type: string
          description: Telefone do veterinário.
          maxLength: 30
    Pet:
      description: Um pet do tutor.
      allOf:
        - $ref: "#/components/schemas/PetInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            photoUrl:
              type: string
              format: uri
              description: |
                URL temporária da foto de perfil, válida por 15 minutos.
                O campo não vem quando o pet não tem foto.
    PetList:
      type: object
      required: [pets]
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
    Species:
      type: string
      description: Espécie do pet.
      enum: [dog, cat, other]
    Sex:
      type: string
      description: Sexo do pet.
      enum: [male, female, unknown]
    Size:
      type: string
      description: Porte do pet.
      enum: [small, medium, large]
    Noseprint:
      type: object
      description: Cadastro biométrico de um pet, a foto do focinho com o vetor dela.
      required: [id, imageUrl, quality, modelVersion, capturedAt]
      properties:
        id:
          type: string
          format: uuid
        imageUrl:
          type: string
          description: URL temporária da foto do focinho. Vale por 900 segundos.
        quality:
          type: number
          format: double
          description: Nitidez da foto, de 0 a 1.
          minimum: 0
          maximum: 1
        modelVersion:
          type: string
          description: Versão do modelo que gerou o vetor.
        capturedAt:
          type: string
          format: date-time
    Identification:
      type: object
      description: Resultado da busca de um focinho no acervo.
      required: [id, candidates]
      properties:
        id:
          type: string
          format: uuid
        candidates:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/IdentificationCandidate"
    IdentificationCandidate:
      type: object
      description: Um pet parecido com a foto enviada. Não tem dado do tutor.
      required: [id, petName, similarity, strong]
      properties:
        id:
          type: string
          format: uuid
        petName:
          type: string
        petPhotoUrl:
          type: string
          description: URL temporária da foto de perfil do pet. Vale por 900 segundos.
        similarity:
          type: number
          format: double
          description: Cosseno entre a foto enviada e a foto mais parecida do pet.
        strong:
          type: boolean
          description: Correspondência forte, a similaridade chega ao limiar do tamanho do acervo.
    FoundNotice:
      type: object
      description: O que o tutor vê de uma confirmação, o pet e o contato de quem encontrou.
      required: [id, petId, petName, contactName, contactPhone, confirmedAt]
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        petName:
          type: string
        contactName:
          type: string
        contactPhone:
          type: string
        message:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        confirmedAt:
          type: string
          format: date-time
    FoundNoticeList:
      type: object
      required: [notices]
      properties:
        notices:
          type: array
          items:
            $ref: "#/components/schemas/FoundNotice"
    ReportType:
      type: string
      enum: [lost, found]
    ReportStatus:
      type: string
      enum: [open, resolved]
    LostReportInput:
      type: object
      description: |
        A latitude e a longitude são obrigatórias. Sem uma delas, a resposta é 400 `invalid_request`.
        O esquema não as marca como obrigatórias para o servidor saber quando uma delas falta.
      required: [petId]
      properties:
        petId:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        place:
          type: string
          description: Nome do local, com no máximo 200 caracteres.
        description:
          type: string
          description: Recado, com no máximo 1.000 caracteres.
        occurredAt:
          type: string
          format: date-time
          description: Quando o pet desapareceu. Não é futura. Sem valor, vale o momento do registro.
    SightingInput:
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        place:
          type: string
          description: Nome do local, com no máximo 200 caracteres.
        description:
          type: string
          description: Recado, com no máximo 1.000 caracteres.
    Sighting:
      type: object
      description: Um avistamento. Não tem dado de quem avistou.
      required: [id, latitude, longitude, createdAt]
      properties:
        id:
          type: string
          format: uuid
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        place:
          type: string
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    Report:
      type: object
      description: Uma ocorrência. Não tem dado do autor.
      required: [id, type, status, latitude, longitude, occurredAt, createdAt, sightings]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/ReportType"
        status:
          $ref: "#/components/schemas/ReportStatus"
        petId:
          type: string
          format: uuid
          description: O pet de um desaparecimento.
        petName:
          type: string
        petSpecies:
          $ref: "#/components/schemas/Species"
        petHasNoseprint:
          type: boolean
          description: O pet tem cadastro biométrico, e quem o encontrar pode identificá-lo pela foto do focinho.
        photoUrl:
          type: string
          description: URL temporária da foto de perfil do pet, ou da foto do focinho de um achado. Vale por 900 segundos.
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        place:
          type: string
        description:
          type: string
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        sightings:
          type: array
          description: Os avistamentos de um desaparecimento, do mais antigo para o mais novo. Vazia nas listas.
          items:
            $ref: "#/components/schemas/Sighting"
    ReportList:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          items:
            $ref: "#/components/schemas/Report"
    ReportPage:
      type: object
      required: [reports, page, hasNext, openLost, openFound]
      properties:
        reports:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/Report"
        page:
          type: integer
        hasNext:
          type: boolean
        openLost:
          type: integer
          description: Número de desaparecimentos abertos no mural.
        openFound:
          type: integer
          description: Número de achados abertos no mural.
    FoundReportCreated:
      type: object
      required: [report, resolveCode]
      properties:
        report:
          $ref: "#/components/schemas/Report"
        resolveCode:
          type: string
          description: Código que resolve o achado. Ele aparece só nesta resposta.
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    Device:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          description: Token de push do Firebase Cloud Messaging, com no máximo 4.096 caracteres.
        platform:
          type: string
          enum: [android, ios, web]
    NotificationKind:
      type: string
      description: |
        `lost_nearby`: um pet desapareceu perto do tutor. `sighting`: alguém viu o pet do tutor.
        `found`: alguém encontrou o pet do tutor pela foto do focinho.
      enum: [lost_nearby, sighting, found]
    Notification:
      type: object
      required: [id, kind, title, body, createdAt, read]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/NotificationKind"
        title:
          type: string
        body:
          type: string
        reportId:
          type: string
          format: uuid
          description: A ocorrência da notificação, quando existe.
        distanceMeters:
          type: integer
          description: Distância até o ponto do desaparecimento, no alerta de proximidade.
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
    NotificationList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/Notification"
    HealthEventType:
      type: string
      enum: [vaccine, consultation, medication, exam, note]
    MedicationCategory:
      type: string
      description: Medicação. Obrigatório na medicação.
      enum: [medication, flea, deworm]
    NoteCategory:
      type: string
      description: Anotação. Obrigatório na anotação.
      enum: [disease, weight, allergy, surgery, note, symptom]
    HealthEventInput:
      type: object
      description: |
        Um evento de saúde. Os campos de cada tipo estão na descrição deles.
        Um campo de outro tipo é recusado (RN-80).
      required: [type, date]
      properties:
        type:
          $ref: "#/components/schemas/HealthEventType"
        date:
          type: string
          format: date
          description: Data do evento. Não é futura.
        notes:
          type: string
        name:
          type: string
          description: Nome da vacina, da medicação ou do exame.
        vet:
          type: string
          description: Veterinário. Vacina, consulta e exame.
        manufacturer:
          type: string
          description: Vacina.
        batch:
          type: string
          description: Vacina.
        dose:
          type: string
          description: Vacina.
        nextDoseDate:
          type: string
          format: date
          description: Vacina. Não é anterior à data do evento.
        clinic:
          type: string
          description: Consulta.
        reason:
          type: string
          description: Consulta. Obrigatório na consulta.
        diagnosis:
          type: string
          description: Consulta.
        weightKg:
          type: number
          format: double
          description: Consulta e anotação. De 0,01 a 999,99, com até 2 casas decimais.
        returnDate:
          type: string
          format: date
          description: Consulta. Não é anterior à data do evento.
        medicationCategory:
          $ref: "#/components/schemas/MedicationCategory"
        activeIngredient:
          type: string
          description: Medicação.
        dosage:
          type: string
          description: Medicação.
        frequency:
          type: string
          description: Medicação.
        endDate:
          type: string
          format: date
          description: Medicação. Não é anterior à data do evento.
        inUse:
          type: boolean
          description: Medicação.
        intervalDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Medicação. Intervalo entre as doses, em dias.
        lab:
          type: string
          description: Exame.
        result:
          type: string
          description: Exame.
        noteCategory:
          $ref: "#/components/schemas/NoteCategory"
        title:
          type: string
          description: Anotação. Obrigatório na anotação.
        remind:
          type: boolean
          description: |
            Vacina e medicação. O evento entra nos próximos cuidados. Com esta opção, a vacina tem
            `nextDoseDate` e a medicação tem `intervalDays`.
    HealthEvent:
      type: object
      required: [id, petId, type, date, remind, createdAt]
      properties:
        id:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/HealthEventType"
        date:
          type: string
          format: date
        notes:
          type: string
        name:
          type: string
          description: Nome da vacina, da medicação ou do exame.
        vet:
          type: string
          description: Veterinário. Vacina, consulta e exame.
        manufacturer:
          type: string
          description: Vacina.
        batch:
          type: string
          description: Vacina.
        dose:
          type: string
          description: Vacina.
        nextDoseDate:
          type: string
          format: date
          description: Vacina. Não é anterior à data do evento.
        clinic:
          type: string
          description: Consulta.
        reason:
          type: string
          description: Consulta. Obrigatório na consulta.
        diagnosis:
          type: string
          description: Consulta.
        weightKg:
          type: number
          format: double
          description: Consulta e anotação. De 0,01 a 999,99, com até 2 casas decimais.
        returnDate:
          type: string
          format: date
          description: Consulta. Não é anterior à data do evento.
        medicationCategory:
          $ref: "#/components/schemas/MedicationCategory"
        activeIngredient:
          type: string
          description: Medicação.
        dosage:
          type: string
          description: Medicação.
        frequency:
          type: string
          description: Medicação.
        endDate:
          type: string
          format: date
          description: Medicação. Não é anterior à data do evento.
        inUse:
          type: boolean
          description: Medicação.
        intervalDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Medicação. Intervalo entre as doses, em dias.
        lab:
          type: string
          description: Exame.
        result:
          type: string
          description: Exame.
        noteCategory:
          $ref: "#/components/schemas/NoteCategory"
        title:
          type: string
          description: Anotação. Obrigatório na anotação.
        remind:
          type: boolean
          description: Vacina e medicação. O evento entra nos próximos cuidados.
        createdAt:
          type: string
          format: date-time
    HealthEventList:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/HealthEvent"
    HealthAttachment:
      type: object
      required: [id, url, contentType, fileName, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          description: URL temporária do arquivo. Vale por 900 segundos.
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        fileName:
          type: string
          description: Nome do arquivo enviado, ou "anexo" quando o envio não tem nome.
        sizeBytes:
          type: integer
        createdAt:
          type: string
          format: date-time
    HealthAttachmentList:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/HealthAttachment"
    UpcomingCare:
      type: object
      required: [eventId, petId, petName, type, title, dueDate]
      properties:
        eventId:
          type: string
          format: uuid
        petId:
          type: string
          format: uuid
        petName:
          type: string
        type:
          $ref: "#/components/schemas/HealthEventType"
        title:
          type: string
          description: Nome da vacina ou da medicação.
        dueDate:
          type: string
          format: date
    UpcomingCareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UpcomingCare"
    Owner:
      type: object
      description: O tutor. Pessoa com conta, responsável por pets.
      required: [id, name, email, termsVersion, termsAcceptedAt]
      properties:
        id:
          type: string
          description: Identificador do tutor, um UUID.
        name:
          type: string
        email:
          type: string
        termsVersion:
          type: string
          description: Versão dos termos de uso que o tutor aceitou. Pode ser uma versão anterior à vigente.
        termsAcceptedAt:
          type: string
          format: date-time
    RegisterOwnerRequest:
      type: object
      required: [name, acceptedTermsVersion]
      properties:
        name:
          type: string
          description: Nome do tutor. Não pode ser vazio. Tem no máximo 100 caracteres.
          maxLength: 100
        acceptedTermsVersion:
          $ref: "#/components/schemas/TermsVersion"
    TermsVersion:
      type: string
      description: |
        Versão dos termos de uso. A lista tem só a versão vigente.
        Uma versão nova dos termos troca o valor desta lista.
      enum:
        - "2026-11-10"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ShareLink:
      type: object
      description: Um link da carteirinha, sem o token.
      required: [id, expiresAt, opens, createdAt]
      properties:
        id:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        opens:
          type: integer
          description: Quantas vezes a carteirinha foi aberta pelo link.
        createdAt:
          type: string
          format: date-time
    CreatedShareLink:
      description: O link criado, com o token. O app monta o endereço `<web>/card#token=<token>`.
      allOf:
        - $ref: "#/components/schemas/ShareLink"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: 32 bytes aleatórios em base64url, sem preenchimento (RN-39).
    ShareLinkList:
      type: object
      required: [links]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/ShareLink"
    HealthCard:
      type: object
      description: A carteirinha do pet (RN-83). Sem dados do tutor, sem IDs internos e sem anexos.
      required: [pet, vaccines, parasiteControl]
      properties:
        pet:
          $ref: "#/components/schemas/HealthCardPet"
        vaccines:
          type: array
          description: Da mais nova para a mais antiga.
          items:
            $ref: "#/components/schemas/HealthCardVaccine"
        parasiteControl:
          type: array
          description: As medicações antipulgas e vermífugo, da mais nova para a mais antiga.
          items:
            $ref: "#/components/schemas/HealthCardMedication"
    HealthCardPet:
      type: object
      required: [name, species]
      properties:
        name:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        breed:
          type: string
        sex:
          $ref: "#/components/schemas/Sex"
        birthDate:
          type: string
          format: date
        weightKg:
          type: number
          format: double
        neutered:
          type: boolean
        photoUrl:
          type: string
          format: uri
          description: URL temporária da foto de perfil, válida por 15 minutos.
        vetName:
          type: string
        vetClinic:
          type: string
        vetPhone:
          type: string
    HealthCardVaccine:
      type: object
      required: [name, date]
      properties:
        name:
          type: string
        date:
          type: string
          format: date
        nextDoseDate:
          type: string
          format: date
        manufacturer:
          type: string
        batch:
          type: string
        dose:
          type: string
        vet:
          type: string
    HealthCardMedication:
      type: object
      required: [name, category, date]
      properties:
        name:
          type: string
        category:
          type: string
          enum: [flea, deworm]
        date:
          type: string
          format: date
        intervalDays:
          type: integer
    Error:
      type: object
      description: Formato único de erro. Todo erro da API usa este formato.
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Texto para diagnóstico. O cliente não mostra este texto ao usuário.
    ErrorCode:
      type: string
      description: |
        Código estável do erro. O cliente escolhe o texto da tela por este código.
        Um código novo entra nesta lista antes de entrar no código do servidor.
      enum:
        - not_found
        - internal_error
        - unavailable
        - unauthenticated
        - invalid_request
        - owner_not_found
        - pet_not_found
        - noseprint_not_found
        - identification_not_found
        - report_not_found
        - lost_report_open
        - report_not_open
        - notification_not_found
        - health_event_not_found
        - attachment_limit
        - share_link_not_found
        - rate_limited
        - species_not_supported
        - image_low_quality
        - image_framing
  responses:
    InvalidRequest:
      description: O corpo ou um parâmetro é inválido. O código do erro é `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnerNotFound:
      description: A conta ainda não registrou o tutor. O código do erro é `owner_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PetNotFound:
      description: |
        O pet não existe para este tutor, com o código `pet_not_found`.
        Ou a conta ainda não registrou o tutor, com o código `owner_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NosePhotoRefused:
      description: |
        A foto do focinho foi recusada. O código do erro diz o motivo:
        `species_not_supported` quando o pet não é um cachorro,
        `image_low_quality` quando a foto não tem nitidez,
        `image_framing` quando a foto não mostra um focinho.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReportNotFound:
      description: A ocorrência não existe. O código do erro é `report_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HealthEventNotFound:
      description: |
        O evento ou o anexo não existe para este pet, com o código `health_event_not_found`.
        Ou o pet não existe para este tutor, com o código `pet_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ShareLinkNotFound:
      description: |
        O link da carteirinha não existe, com o código `share_link_not_found`.
        Ou o pet não existe para este tutor, com o código `pet_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Muitas chamadas deste endereço em pouco tempo. O código do erro é `rate_limited`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Uma parte do sistema que a operação usa não responde. O código do erro é `unavailable`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: A chamada não tem token, ou o token é inválido ou está vencido. O código do erro é `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Erro no formato único.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
