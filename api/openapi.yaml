openapi: 3.1.0
info:
  title: Nupii API
  version: 0.1.0
  description: |
    Contrato da API do Nupii. Este arquivo é a fonte do contrato.
    Os tipos do servidor e dos clientes são gerados dele.
tags:
  - name: service
    description: Estado do serviço.
  - name: identity
    description: Conta do tutor.
  - name: pets
    description: Pets do tutor.
paths:
  /v1/health:
    get:
      operationId: getHealth
      tags: [service]
      summary: Informa se o serviço está pronto para atender requisições.
      responses:
        "200":
          description: O serviço está em execução e o banco de dados responde.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: O banco de dados não responde. O código do erro é `unavailable`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Devolve o tutor da conta que fez a chamada.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O tutor da conta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          description: A conta ainda não registrou o tutor. O código do erro é `owner_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: registerMe
      tags: [identity]
      summary: Registra o tutor da conta, com o aceite dos termos de uso.
      description: |
        O e-mail vem do token. Uma segunda chamada da mesma conta não muda o tutor e devolve 200.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterOwnerRequest"
      responses:
        "200":
          description: A conta já tinha um tutor. A resposta tem esse tutor, sem mudança.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "201":
          description: O tutor foi registrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Owner"
        "400":
          description: O corpo é inválido, o nome está vazio ou a versão dos termos não é a vigente. O código do erro é `invalid_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: Lista os pets do tutor, em ordem de nome.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Os pets do tutor que não foram excluídos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createPet
      tags: [pets]
      summary: Cria um pet do tutor.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: O pet foi criado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OwnerNotFound"
        default:
          $ref: "#/components/responses/Error"
  /v1/pets/{petId}:
    parameters:
      - $ref: "#/components/parameters/PetId"
    get:
      operationId: getPet
      tags: [pets]
      summary: Devolve um pet do tutor.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: O pet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updatePet
      tags: [pets]
      summary: Troca todos os dados de um pet do tutor.
      description: Um dado opcional que não vem no corpo fica vazio no pet.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "200":
          description: O pet com os dados novos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Exclui um pet do tutor.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: O pet foi excluído.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/PetNotFound"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: ID token do Firebase Authentication, no cabeçalho `Authorization`.
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: Identificador do pet.
      schema:
        type: string
        format: uuid
  schemas:
    PetInput:
      type: object
      description: Dados de um pet que o tutor informa.
      required: [name, species]
      properties:
        name:
          type: string
          description: Nome do pet. Não pode ser vazio.
          maxLength: 100
        species:
          $ref: "#/components/schemas/Species"
        breed:
          type: string
          description: Raça, em texto livre.
          maxLength: 100
        sex:
          $ref: "#/components/schemas/Sex"
        size:
          $ref: "#/components/schemas/Size"
        birthDate:
          type: string
          format: date
          description: Data de nascimento. Não pode ser uma data futura.
        weightKg:
          type: number
          format: double
          description: Peso em quilos, com no máximo 2 casas decimais.
          minimum: 0.01
          maximum: 999.99
        neutered:
          type: boolean
          description: Informa se o pet é castrado.
        vetName:
          type: string
          description: Nome do veterinário.
          maxLength: 120
        vetClinic:
          type: string
          description: Clínica do veterinário.
          maxLength: 120
        vetPhone:
          type: string
          description: Telefone do veterinário.
          maxLength: 30
    Pet:
      description: Um pet do tutor.
      allOf:
        - $ref: "#/components/schemas/PetInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    PetList:
      type: object
      required: [pets]
      properties:
        pets:
          type: array
          items:
            $ref: "#/components/schemas/Pet"
    Species:
      type: string
      description: Espécie do pet.
      enum: [dog, cat, other]
    Sex:
      type: string
      description: Sexo do pet.
      enum: [male, female, unknown]
    Size:
      type: string
      description: Porte do pet.
      enum: [small, medium, large]
    Owner:
      type: object
      description: O tutor. Pessoa com conta, responsável por pets.
      required: [id, name, email, termsVersion, termsAcceptedAt]
      properties:
        id:
          type: string
          description: Identificador do tutor, um UUID.
        name:
          type: string
        email:
          type: string
        termsVersion:
          type: string
          description: Versão dos termos de uso que o tutor aceitou. Pode ser uma versão anterior à vigente.
        termsAcceptedAt:
          type: string
          format: date-time
    RegisterOwnerRequest:
      type: object
      required: [name, acceptedTermsVersion]
      properties:
        name:
          type: string
          description: Nome do tutor. Não pode ser vazio. Tem no máximo 100 caracteres.
          maxLength: 100
        acceptedTermsVersion:
          $ref: "#/components/schemas/TermsVersion"
    TermsVersion:
      type: string
      description: |
        Versão dos termos de uso. A lista tem só a versão vigente.
        Uma versão nova dos termos troca o valor desta lista.
      enum:
        - "2026-11-10"
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      description: Formato único de erro. Todo erro da API usa este formato.
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Texto para diagnóstico. O cliente não mostra este texto ao usuário.
    ErrorCode:
      type: string
      description: |
        Código estável do erro. O cliente escolhe o texto da tela por este código.
        Um código novo entra nesta lista antes de entrar no código do servidor.
      enum:
        - not_found
        - internal_error
        - unavailable
        - unauthenticated
        - invalid_request
        - owner_not_found
        - pet_not_found
  responses:
    InvalidRequest:
      description: O corpo ou um parâmetro é inválido. O código do erro é `invalid_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OwnerNotFound:
      description: A conta ainda não registrou o tutor. O código do erro é `owner_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PetNotFound:
      description: |
        O pet não existe para este tutor, com o código `pet_not_found`.
        Ou a conta ainda não registrou o tutor, com o código `owner_not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: A chamada não tem token, ou o token é inválido ou está vencido. O código do erro é `unauthenticated`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Erro no formato único.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
