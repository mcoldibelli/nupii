name: inference

on:
  push:
    branches: [develop, main]
    paths:
      - "inference/**"
      - ".github/workflows/inference.yml"
  pull_request:
    paths:
      - "inference/**"
      - ".github/workflows/inference.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: inference/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ./lint.sh
      - name: Weight files
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./download_weights.sh
      - name: Tests
        run: pytest
