name: integration

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "api/**"
      - "deploy/**"
      - ".github/workflows/integration.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - "deploy/**"
      - ".github/workflows/integration.yml"

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Create deploy/.env with random credentials
        run: |
          sed \
            -e "s/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" \
            -e "s/^S3_SECRET_ACCESS_KEY=$/S3_SECRET_ACCESS_KEY=$(openssl rand -hex 24)/" \
            deploy/.env.example > deploy/.env
      - name: Start the API, the database and the S3 server
        run: docker compose -f deploy/compose.yaml up -d --wait --build
      - name: Call the API
        run: curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/v1/health
      - name: Integration tests
        working-directory: backend
        run: |
          set -a; . ../deploy/.env; set +a
          export DATABASE_URL="postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB?sslmode=disable"
          go test -race -tags=integration ./...
      - name: Logs of the services
        if: failure()
        run: docker compose -f deploy/compose.yaml logs
