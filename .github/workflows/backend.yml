name: backend

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Lint
        run: ./lint.sh
      - name: Generated code matches the contract
        run: |
          go generate ./...
          git diff --exit-code
      - name: Unit tests
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/api
      - name: Test libraries are not in the binary
        run: |
          if go list -deps ./cmd/api | grep -q kin-openapi; then
            echo "kin-openapi is imported outside the test files" >&2
            exit 1
          fi
