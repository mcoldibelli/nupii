name: mobile

on:
  push:
    branches: [develop, main]
    paths:
      - "mobile/**"
      - "api/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "api/**"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated types match the contract
        run: |
          npm run generate:api
          git diff --exit-code
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build the Android bundle
        run: npx expo export --platform android --output-dir "$RUNNER_TEMP/export"
